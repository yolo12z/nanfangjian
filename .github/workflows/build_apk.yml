name: Build NanFangJian App (Android & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanFangJian-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "南方见 v1.0.3 (Android & iOS双端支持版)"
          body: |
            ### 🧭「南方见」Android & iOS 双端支持正式发布！

            > “风过千山，我们在南方见。”
            > 构成主义抽象先锋 ✖ 奶龙实体伴游 ✖ 专属人物南向锁定

            #### 📲 支持平台：
            - **Android (APK)**: 直接下载下方 `app-release.apk` 即可安装使用。
            - **iOS**: 源码工程已完整支持 iOS，并在仓库 Actions 中通过 macOS 机器完成了 iOS 编译验证。
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (No codesign for CI validation)
        run: flutter build ios --release --no-codesign
