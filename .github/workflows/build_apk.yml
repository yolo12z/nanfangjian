name: Build NanFangJian APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanFangJian-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "南方见 v1.0.1 (正式版)"
          body: |
            ### 🧭「南方见」正式版 APK 发布

            > “风过千山，我们在南方见。”
            > 不论身在何方，他始终面朝南方守护你。

            #### ✨ 本次全新设计语言升级：
            - **视觉重构**：全新深邃夜空与浪漫渐变流光，正南方位特制专属红光呼吸动效；
            - **朝向诗意状态**：将八个方向赋予诗意文案，精准对准南方时触发【相见】与【向南而行】状态指示；
            - **传感器与校准**：人物原图正上方（头顶举手方向）绝对锁定地理正南方（South），随机身转动实时自稳定；
            - **应用名称**：Android 桌面应用名称正式命名为「南方见」。
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
