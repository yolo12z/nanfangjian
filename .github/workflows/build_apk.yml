name: Build NanFangJian APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanFangJian-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "南方见 v1.0.2 (至上先锋·奶龙艺术限定版)"
          body: |
            ### 🧭「南方见」至上先锋·奶龙艺术限定版 APK 发布

            > “风过千山，我们在南方见。”
            > 俄罗斯先锋派构成主义视觉冲击 ✖ 奶龙元气神态 ✖ 专属人物恒指南方

            #### 💥 核心美学与功能革新：
            1. **构成主义（Constructivism）抽象先锋背景**：完美融入马列维奇/至上主义风格红、黑、奶黄强对比几何海报作为视觉基调；
            2. **真实奶龙立像伴随罗盘漫游**：双手抱胸的奶龙神情逼真，随人物指南针同步锁定南方，正南触发先锋红光双圈爆发脉冲；
            3. **去除手动拖拽，纯正传感器驱动**：工业风粗体角度仪表 + 方位代号；
            4. **一键全天候桌面悬浮指针**：透明背景迷你人物常驻手机桌面/任意 App，随时随地直指南方！
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
